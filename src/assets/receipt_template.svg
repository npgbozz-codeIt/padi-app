<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- Outer Social/Chat Share Canvas (Carbon Pitch #0D0E11) -->
  <rect id="Outer_Canvas" x="0" y="0" width="1080" height="1350" fill="#0D0E11" />

  <!-- Top Decorative 45-Degree Volt Yellow Signal Accent Bar -->
  <g id="Top_Signal_Accent" fill="#FFE600" opacity="0.9">
    <polygon points="90,40 130,40 110,60 70,60" />
    <polygon points="145,40 185,40 165,60 125,60" />
    <polygon points="200,40 240,40 220,60 180,60" />
  </g>

  <!-- ========================================================= -->
  <!-- MAIN RECEIPT TICKET CARD (WITH SIDE NOTCH CUTOUTS AT Y=520)-->
  <!-- ========================================================= -->
  <path id="Receipt_Ticket_Body" fill="#1C1E24" stroke="#2E323B" stroke-width="3" d="
    M 122,90 
    H 958 
    A 32,32 0 0 1 990,122 
    V 492 
    A 28,28 0 0 0 990,548 
    V 1218 
    A 32,32 0 0 1 958,1250 
    H 122 
    A 32,32 0 0 1 90,1218 
    V 548 
    A 28,28 0 0 0 90,492 
    V 122 
    A 32,32 0 0 1 122,90 Z" />

  <!-- ========================================================= -->
  <!-- HEADER ZONE: POCKET PADI LOGO + PAID // INSTANT BADGE     -->
  <!-- ========================================================= -->
  <g id="Receipt_Header_Bar">
    <!-- Embedded Pocket Padi + MyPadi Lockup (Scaled 0.62x) -->
    <g id="Header_Logo_Lockup" transform="translate(140, 140) scale(0.62)">
      <!-- Mascot -->
      <g id="Mini_Mascot">
        <rect x="-8" y="34" width="14" height="24" rx="6" fill="#FFE600" />
        <rect x="106" y="34" width="14" height="24" rx="6" fill="#FFE600" />
        <path fill="#FFE600" d="M 24,0 H 88 A 24,24 0 0 1 112,24 V 62 A 24,24 0 0 1 88,86 H 86 V 108 L 62,86 H 24 A 24,24 0 0 1 0,62 V 24 A 24,24 0 0 1 24,0 Z" />
        <path fill="#0D0E11" stroke="#FFE600" stroke-width="5" stroke-linejoin="round" d="M -6,24 H 118 A 4,4 0 0 1 121.5,29.8 L 106,62 A 8,8 0 0 1 98.8,66.5 H 68 L 61,56 H 51 L 44,66.5 H 13.2 A 8,8 0 0 1 6,62 L -9.5,29.8 A 4,4 0 0 1 -6,24 Z" />
        <path fill="none" stroke="#00F59B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 20,50 L 30,38 L 40,50" />
        <path fill="none" stroke="#00F59B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 72,50 L 82,38 L 92,50" />
      </g>
      <!-- Wordmark Curves -->
      <g transform="translate(148, 10)" fill="#FFE600">
        <path d="M 0,76 V 4 A 4,4 0 0 1 4,0 H 18 A 6,6 0 0 1 23.5,3.6 L 42,46 L 60.5,3.6 A 6,6 0 0 1 66,0 H 80 A 4,4 0 0 1 84,4 V 76 H 68 V 26 L 48,68 H 36 L 16,26 V 76 H 0 Z" />
        <path d="M 96,20 H 113 L 128,58 L 143,20 H 160 L 135,82 C 130,94 122,98 108,98 H 98 V 84 H 106 C 113,84 117,82 119,76 L 120,73 L 96,20 Z" />
        <path d="M 172,76 V 4 A 4,4 0 0 1 176,0 H 218 C 236,0 248,11 248,27 C 248,43 236,54 218,54 H 188 V 76 H 172 Z M 188,39 H 216 C 225,39 231,34 231,27 C 231,20 225,15 216,15 H 196 L 188,23 V 39 Z" />
        <path d="M 286,76 C 268,76 256,64 256,48 C 256,32 268,20 286,20 C 296,20 303,24 307,30 V 21 H 323 V 76 H 307 V 66 C 303,72 296,76 286,76 Z M 290,62 C 300,62 307,56 307,48 C 307,40 300,34 290,34 C 280,34 273,40 273,48 C 273,56 280,62 290,62 Z" />
        <path d="M 366,76 C 348,76 336,64 336,48 C 336,32 348,20 366,20 C 376,20 383,24 387,30 V 0 H 403 V 76 H 387 V 66 C 383,72 376,76 366,76 Z M 370,62 C 380,62 387,56 387,48 C 387,40 380,34 370,34 C 360,34 353,40 353,48 C 353,56 360,62 370,62 Z" />
        <rect x="418" y="21" width="16" height="55" rx="2" />
        <path d="M 426,-4 H 434 A 4,4 0 0 1 438,0 V 6 A 8,8 0 0 1 430,14 H 418 V 4 A 8,8 0 0 1 426,-4 Z" />
      </g>
    </g>

    <!-- Status Pill Badge: PAID // INSTANT (Cyber Mint #00F59B) -->
    <g id="Status_Pill_Badge" transform="translate(680, 148)">
      <rect x="0" y="0" width="250" height="54" rx="27" fill="#00F59B" />
      <circle cx="34" cy="27" r="7" fill="#0D0E11" />
      <text x="136" y="34" font-family="JetBrains Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#0D0E11" text-anchor="middle" letter-spacing="1">{{STATUS_LABEL}}</text>
    </g>
  </g>

  <!-- Subtle Header Divider -->
  <line x1="140" y1="245" x2="940" y2="245" stroke="#2E323B" stroke-width="2" />

  <!-- ========================================================= -->
  <!-- HERO VALUE BLOCK (AMOUNT & UTILITY TYPE)                  -->
  <!-- ========================================================= -->
  <g id="Hero_Amount_Block" transform="translate(540, 315)" text-anchor="middle">
    <text x="0" y="0" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600" fill="#94A3B8" letter-spacing="3">VERIFIED UTILITY RECEIPT</text>
    <text x="0" y="85" font-family="Space Grotesk, Plus Jakarta Sans, Arial, sans-serif" font-size="82" font-weight="700" fill="#F8F9FA" letter-spacing="-1">{{AMOUNT}}</text>
    
    <!-- Service Category Pill -->
    <rect x="-240" y="115" width="480" height="44" rx="10" fill="#0D0E11" stroke="#2E323B" stroke-width="2" />
    <text x="0" y="144" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFE600" letter-spacing="1">{{SERVICE_CATEGORY}}</text>
  </g>

  <!-- Perforated Ticket Tear Line (Aligned with Y=520 Side Cutouts) -->
  <line id="Ticket_Tear_Line" x1="130" y1="520" x2="950" y2="520" stroke="#2E323B" stroke-width="3" stroke-dasharray="14, 14" />

  <!-- ========================================================= -->
  <!-- RECESSED TOKEN / PIN HIGHLIGHT BOX                        -->
  <!-- ========================================================= -->
  <g id="Token_Highlight_Box" transform="translate(140, 565)">
    <rect x="0" y="0" width="800" height="145" rx="18" fill="#0D0E11" stroke="#FFE600" stroke-width="2.5" stroke-dasharray="10, 6" />
    <text x="400" y="42" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">{{TOKEN_HEADER}}</text>
    <text x="400" y="102" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#FFE600" text-anchor="middle" letter-spacing="2">{{TOKEN_VALUE}}</text>
  </g>

  <!-- ========================================================= -->
  <!-- TRANSACTION METADATA GRID (2-COLUMN ROWS)                 -->
  <!-- ========================================================= -->
  <g id="Metadata_Rows" transform="translate(140, 765)">
    <!-- Row 1: Customer / Recipient -->
    <text x="0" y="0" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="1.5">{{ROW1_LABEL}}</text>
    <text x="800" y="0" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#F8F9FA" text-anchor="end">{{ROW1_VALUE}}</text>
    <line x1="0" y1="26" x2="800" y2="26" stroke="#2E323B" stroke-width="1.5" />

    <!-- Row 2: Provider / Network -->
    <text x="0" y="75" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="1.5">BILLER / PROVIDER</text>
    <text x="800" y="75" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8F9FA" text-anchor="end">{{PROVIDER_VALUE}}</text>
    <line x1="0" y1="101" x2="800" y2="101" stroke="#2E323B" stroke-width="1.5" />

    <!-- Row 3: Payment Method -->
    <text x="0" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="1.5">PAYMENT METHOD</text>
    <text x="800" y="150" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#00F59B" text-anchor="end">MYPADI INSTANT WALLET</text>
    <line x1="0" y1="176" x2="800" y2="176" stroke="#2E323B" stroke-width="1.5" />

    <!-- Row 4: Date & Timestamp -->
    <text x="0" y="225" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="1.5">TIMESTAMP (WAT)</text>
    <text x="800" y="225" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="600" fill="#F8F9FA" text-anchor="end">{{TIMESTAMP}}</text>
    <line x1="0" y1="251" x2="800" y2="251" stroke="#2E323B" stroke-width="1.5" />

    <!-- Row 5: Reference ID -->
    <text x="0" y="300" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="1.5">TRANSACTION REF</text>
    <text x="800" y="300" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#FFE600" text-anchor="end">{{REFERENCE}}</text>
  </g>

  <!-- ========================================================= -->
  <!-- SECURITY FOOTER & BARCODE STRIP                           -->
  <!-- ========================================================= -->
  <g id="Receipt_Security_Footer" transform="translate(140, 1135)">
    <rect x="0" y="0" width="800" height="76" rx="12" fill="#0D0E11" />
    
    <!-- Brand Sign-off -->
    <text x="28" y="34" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFE600">Powered by MyPadi — Your Sharp Utility Padi</text>
    <text x="28" y="58" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#94A3B8">Telegram: @MyPadiBot  |  Npg Cybertech Ltd</text>

    <!-- Vector Verification Barcode Graphic -->
    <g id="Verification_Barcode" transform="translate(620, 16)" fill="#F8F9FA" opacity="0.85">
      <rect x="0" y="0" width="6" height="44" />
      <rect x="12" y="0" width="3" height="44" />
      <rect x="20" y="0" width="9" height="44" />
      <rect x="34" y="0" width="3" height="44" />
      <rect x="42" y="0" width="6" height="44" />
      <rect x="54" y="0" width="12" height="44" />
      <rect x="72" y="0" width="3" height="44" />
      <rect x="80" y="0" width="6" height="44" />
      <rect x="92" y="0" width="3" height="44" />
      <rect x="100" y="0" width="9" height="44" />
      <rect x="114" y="0" width="3" height="44" />
      <rect x="122" y="0" width="6" height="44" />
      <rect x="134" y="0" width="9" height="44" />
      <rect x="148" y="0" width="4" height="44" fill="#FFE600" />
    </g>
  </g>
</svg>